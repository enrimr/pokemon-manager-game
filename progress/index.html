<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trainer Manager — Build Progress</title>
<style>
  :root {
    --bg: #14171c; --panel: #1c2027; --panel2: #232833; --text: #e8eaed;
    --dim: #9aa3af; --accent: #7c5cff; --ok: #3ecf8e; --warn: #f0b429; --bad: #ef5f5f;
    --border: #2c3340;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "SF Mono", ui-monospace, Menlo, monospace; padding: 32px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 0.5px; }
  .sub { color: var(--dim); margin-bottom: 24px; }
  .global { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 24px; }
  .global .phase { font-size: 16px; color: var(--accent); font-weight: 700; }
  .global .note { color: var(--dim); margin-top: 4px; white-space: pre-wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; display: flex; justify-content: space-between; align-items: center; }
  .card .fmref { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .badge { font-size: 11px; padding: 2px 10px; border-radius: 999px; font-weight: 700; letter-spacing: 0.5px; }
  .b-pending  { background: #2a2f3a; color: var(--dim); }
  .b-building { background: #2b2450; color: #b3a1ff; }
  .b-critic   { background: #4a3a10; color: var(--warn); }
  .b-fixing   { background: #4a2310; color: #ff9e6d; }
  .b-passed   { background: #123a2a; color: var(--ok); }
  .b-capped   { background: #451b1b; color: var(--bad); }
  .row { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin: 2px 0; }
  .row b { color: var(--text); font-weight: 600; }
  .gap { margin-top: 8px; padding: 8px 10px; background: var(--panel2); border-left: 3px solid var(--warn);
    border-radius: 4px; font-size: 12px; color: #d9c98a; }
  .hist { margin-top: 8px; font-size: 11px; color: var(--dim); }
  .hist div { padding: 1px 0; }
  .w-ours { color: var(--ok); } .w-fm { color: var(--bad); }
  .updated { color: var(--dim); font-size: 11px; margin-top: 8px; text-align: right; }
  footer { color: var(--dim); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
  <h1>TRAINER MANAGER <span style="color:var(--accent)">// build progress</span></h1>
  <div class="sub">Football Manager for Pokémon battles &amp; tournaments — Godot 4.6. Auto-refreshes every 5s.</div>
  <div class="global" id="global">
    <div class="phase">loading…</div><div class="note"></div>
  </div>
  <div class="grid" id="grid"></div>
  <footer>Each piece loops: build → blind critic (runs the real game, judges vs Football Manager) → fix → re-judge, until ours wins.</footer>
<script>
const PIECES = ["shell","squad","tactics","match","competition","transfers","training","inbox"];
async function j(url){ try { const r = await fetch(url + "?t=" + Date.now()); return r.ok ? await r.json() : null; } catch(e){ return null; } }
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
async function refresh(){
  const g = await j("global.json");
  if (g) {
    document.querySelector("#global .phase").textContent = g.phase || "";
    document.querySelector("#global .note").textContent = (g.note || "") + (g.updated ? "\nupdated: " + g.updated : "");
  }
  const cards = await Promise.all(PIECES.map(p => j("pieces/" + p + ".json")));
  document.getElementById("grid").innerHTML = cards.map((c,i) => {
    if (!c) return `<div class="card"><h2>${PIECES[i]}<span class="badge b-pending">PENDING</span></h2></div>`;
    const st = c.status || "pending";
    const hist = (c.history||[]).map(h =>
      `<div>round ${h.round}: <span class="${h.winner==='ours'?'w-ours':'w-fm'}">${h.winner==='ours'?'OURS WINS':'FM WINS'}</span>${h.gap? ' — '+esc(h.gap):''}</div>`).join("");
    return `<div class="card">
      <h2>${esc(c.piece||PIECES[i])}<span class="badge b-${st}">${st.toUpperCase()}</span></h2>
      <div class="fmref">${esc(c.fm_reference||"")}</div>
      <div class="row"><span>critic rounds</span><b>${c.round??0}</b></div>
      <div class="row"><span>last verdict</span><b>${esc(c.verdict||"—")}</b></div>
      ${c.biggest_gap ? `<div class="gap">⚑ ${esc(c.biggest_gap)}</div>` : ""}
      ${hist ? `<div class="hist">${hist}</div>` : ""}
      <div class="updated">${esc(c.updated||"")}</div>
    </div>`;
  }).join("");
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>

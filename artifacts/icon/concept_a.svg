<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3d"/>
      <stop offset="1" stop-color="#12151f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6dff"/>
      <stop offset="1" stop-color="#6a48e8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- subtle pitch grid -->
  <g stroke="#3a4258" stroke-width="6" opacity="0.35" fill="none">
    <circle cx="512" cy="512" r="330"/>
    <line x1="120" y1="512" x2="904" y2="512"/>
  </g>
  <!-- crest shield -->
  <path d="M512 150 L800 240 V560 C800 720 672 830 512 890 C352 830 224 720 224 560 V240 Z"
        fill="url(#shield)" stroke="#c9b8ff" stroke-width="18"/>
  <!-- TM monogram -->
  <g fill="#f4f1ff">
    <path d="M330 330 h180 v62 h-58 v210 h-64 v-210 h-58 z"/>
    <path d="M540 330 h70 l52 128 52-128 h70 v272 h-62 v-150 l-46 116 h-28 l-46-116 v150 h-62 z"/>
  </g>
  <!-- type triad -->
  <g>
    <circle cx="422" cy="712" r="34" fill="#ff6b57"/>
    <circle cx="512" cy="726" r="34" fill="#ffd23e"/>
    <circle cx="602" cy="712" r="34" fill="#4fa8ff"/>
  </g>
</svg>
